name: Build SHAHIL APK

run-name: APK build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build ID from Telegram bot"
        required: true
        type: string
      archive_branch:
        description: "Temporary branch containing the uploaded project ZIP"
        required: true
        type: string
      archive_path:
        description: "Path to the uploaded ZIP in that branch"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout uploaded archive branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.archive_branch }}
          persist-credentials: false

      - name: Verify and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${{ inputs.archive_path }}"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::ZIP not found: $ARCHIVE"
            exit 1
          fi

          mkdir -p extracted-project
          unzip -q "$ARCHIVE" -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings.gradle file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found under $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools,platforms;android-34,build-tools;34.0.0'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
