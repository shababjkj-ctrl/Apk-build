
name: Build SHAHIL APK

run-name: APK Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build ID"
        required: true
        type: string

      archive_branch:
        description: "Temporary branch containing uploaded ZIP"
        required: true
        type: string

      archive_path:
        description: "Path of uploaded ZIP file"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout uploaded archive branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.archive_branch }}

      - name: Extract Android project ZIP
        shell: bash
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          set -e

          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "ERROR: Uploaded ZIP not found!"
            exit 1
          fi

          mkdir -p extracted-project

          unzip -q "$ARCHIVE_PATH" -d extracted-project

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Fix pip for Chaquopy
        run: |
          python3.8 -m pip install --upgrade \
            "pip<21.0" six setuptools wheel

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.1.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Gradle build..."

          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
