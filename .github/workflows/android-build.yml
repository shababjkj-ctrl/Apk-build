name: Build SHAHIL APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04        # 20.04 — Python 3.8 নেটিভ, সবচেয়ে stable

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # ── Python 3.8 (Chaquopy এর জন্য) ──────────────────
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Upgrade pip + install six
      run: |
        python3 -m pip install --upgrade pip setuptools wheel six

    # ── Java ────────────────────────────────────────────
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ── Android SDK ─────────────────────────────────────
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install build tools
      run: |
        sdkmanager "build-tools;33.0.1" "platforms;android-34" "ndk;25.2.9519653"

    # ── local.properties ────────────────────────────────
    - name: Write local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    # ── Gradle ──────────────────────────────────────────
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    # ── BUILD ───────────────────────────────────────────
    - name: Build debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    # ── Upload ──────────────────────────────────────────
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHAHIL-FF-Monitor
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
