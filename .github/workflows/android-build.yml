
name: Pella Android APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true
        type: string
      archive_branch:
        description: "Temporary archive branch"
        required: true
        type: string
      archive_path:
        description: "ZIP archive path"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Uploaded Android Project
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.archive_branch }}
          path: uploaded_project
          sparse-checkout: ${{ inputs.archive_path }}

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ARCHIVE="uploaded_project/${{ inputs.archive_path }}"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Uploaded ZIP not found!"
            exit 1
          fi

          mkdir -p android_project
          unzip -q "$ARCHIVE" -d android_project

          echo "ZIP extracted successfully."

          find android_project -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \)

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android_project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLEW"

          echo "Android project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not generated!"
            exit 1
          fi

          mkdir -p final_apk
          cp "$APK" "final_apk/Pella-${{ inputs.build_id }}.apk"

          echo "path=final_apk/Pella-${{ inputs.build_id }}.apk" \
            >> "$GITHUB_OUTPUT"

          echo "APK generated successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Pella APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ID: ${{ inputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
