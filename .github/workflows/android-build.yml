name: Build SHAHIL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            libffi-dev libssl-dev \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libltdl-dev autopoint gettext

      - name: Setup Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      - name: Prepare patched python-for-android
        run: |
          git clone https://github.com/kivy/python-for-android.git p4a
          git -C p4a checkout d2ee8c5
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("p4a/pythonforandroid/recipes/libthorvg/__init__.py")
          s = p.read_text()
          old = '''pattern = join(self.ctx.ndk.llvm_prebuilt_dir, "lib/clang/*/lib/linux", lib_arch)
            clang_lib_dir = glob(pattern)[0]'''
          new = '''patterns = [
                join(self.ctx.ndk.llvm_prebuilt_dir, "lib/clang/*/lib/linux", lib_arch),
                join(self.ctx.ndk.llvm_prebuilt_dir, "lib64/clang/*/lib/linux", lib_arch),
            ]
            matches = [path for pattern in patterns for path in glob(pattern)]
            if not matches:
                raise RuntimeError("NDK Clang runtime library directory not found: " + str(patterns))
            clang_lib_dir = matches[0]'''
          if old not in s:
              raise SystemExit("Expected libthorvg code not found; stopping safely.")
          p.write_text(s.replace(old, new, 1))
          print("libthorvg NDK path fix applied")
          PYCODE

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          source .venv/bin/activate
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHAHIL-FF-Monitor
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHAHIL-build-log
          path: build.log
          if-no-files-found: warn
